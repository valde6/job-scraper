name: scrape-jobs

on:
  schedule:
    - cron: "17 */3 * * *"   # hver 3. time (gratis på GitHub; Claude-synken kører stadig kun 1 gang dagligt)
  push:
    paths: ["triggers/scrape"]
  workflow_dispatch:
    inputs:
      only:
        description: "Kun én virksomhed (navn som i companies.yaml) – tom = alle"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache Playwright-browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.47
      - run: python -m playwright install --with-deps chromium
      - name: Scrape
        run: |
          ONLY="${{ inputs.only }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -f triggers/scrape ]; then ONLY="$(grep -v '^#' triggers/scrape | head -1 || true)"; fi
          if [ -n "$ONLY" ]; then
            python -m scraper.run --only "$ONLY" 2>&1 | tee data/last_run.log
          else
            python -m scraper.run 2>&1 | tee data/last_run.log
          fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Jobs opdateret $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push
