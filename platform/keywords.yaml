# Nøgleordsordbog for Jobradar. Ét nøgleord = ét begreb med danske og engelske varianter.
# Scraperen finder nøgleordene i titel + opslagstekst og sender id'erne til appen (job.keywords).
# Brugerens profil består af 5-15 af disse id'er (+ evt. fritekst). Regex er case-insensitive.
# Tilføj gerne flere, men skift ALDRIG et eksisterende id (brugerprofiler peger på dem).
keywords:
  # --- data, it og digitalisering ---
  - {id: data-analyse, label: "Dataanalyse", en: "Data analysis", group: data, pattern: "data\\s*anal|dataanalys|analyse af data|analytics|analytiker|analyst|data[- ]drevet|data[- ]driven|indsigt(?:er)? fra data"}
  - {id: sql, label: "SQL", en: "SQL", group: data, pattern: "\\bsql\\b|t-sql|postgres|snowflake|bigquery|databricks|\\bdatabaser?\\b"}
  - {id: python, label: "Python", en: "Python", group: data, pattern: "python|pandas|jupyter"}
  - {id: power-bi, label: "Power BI", en: "Power BI", group: data, pattern: "power\\s*bi|tableau|qlik|looker|dashboards?|visualiser"}
  - {id: excel, label: "Excel", en: "Excel", group: data, pattern: "\\bexcel\\b|regneark|spreadsheet|\\bvba\\b|power query"}
  - {id: bi, label: "Business Intelligence", en: "Business intelligence", group: data, pattern: "business intelligence|\\bbi[- ]|\\bbi\\b|datawarehouse|data warehouse|ledelsesrapportering|management reporting|bi-rapport"}
  - {id: ai, label: "AI og machine learning", en: "AI & machine learning", group: data, pattern: "\\bai\\b|kunstig intelligens|artificial intelligence|machine learning|maskinlæring|\\bml\\b|genai|\\bllm|chatgpt|copilot|ai-agent"}
  - {id: automatisering, label: "Automatisering", en: "Automation", group: it, pattern: "automati|\\brpa\\b|power automate|uipath|workflow|robotic process"}
  - {id: digitalisering, label: "Digitalisering", en: "Digitalisation", group: it, pattern: "digitali|digital transformation|digital omstilling|digitale løsninger"}
  - {id: it-projekt, label: "IT-projektledelse", en: "IT project management", group: it, pattern: "it[- ]projekt|projektkoordinat|project coordinat|it project|implementering af (?:it|system)|systemimplementering|implementation project"}
  - {id: erp, label: "ERP / SAP", en: "ERP / SAP", group: it, pattern: "\\berp\\b|\\bsap\\b|dynamics 365|navision|business central|oracle fusion"}
  - {id: crm, label: "CRM / Salesforce", en: "CRM / Salesforce", group: it, pattern: "\\bcrm\\b|salesforce|hubspot|dynamics crm"}
  - {id: programmering, label: "Programmering", en: "Software development", group: it, pattern: "programmering|softwareudvikl|software develop|developer|udvikler|javascript|typescript|\\bc#|\\.net\\b|\\bjava\\b|frontend|backend|full[- ]stack"}
  - {id: cloud, label: "Cloud (Azure/AWS)", en: "Cloud (Azure/AWS)", group: it, pattern: "\\bcloud\\b|azure|\\baws\\b|google cloud|\\bgcp\\b"}
  - {id: cybersikkerhed, label: "IT-sikkerhed", en: "Cyber security", group: it, pattern: "cyber|it[- ]sikkerhed|informationssikkerhed|information security|security analyst|iso 27001|\\bnis2\\b"}
  - {id: ux, label: "UX / brugeroplevelse", en: "UX / user experience", group: it, pattern: "\\bux\\b|\\bui\\b|brugeroplevelse|user experience|brugerrejse|customer journey|figma"}
  - {id: it-support, label: "IT-support", en: "IT support", group: it, pattern: "it[- ]support|helpdesk|service ?desk|servicedesk|first[- ]line|1st line"}
  - {id: agil, label: "Agil / Scrum", en: "Agile / Scrum", group: it, pattern: "\\bagil|\\bagile\\b|scrum|kanban|jira"}
  - {id: it-konsulent, label: "IT-konsulent", en: "IT consulting", group: it, pattern: "it[- ]konsulent|it consult|technology consult|tech consult|digital consult"}
